name: CI

# Test süreçlerini BUGÜN başlatan katman: Core mantığının (M3U/Xtream/EPG/StreamResolver)
# birim testleri her push'ta macOS runner'da çalışır. İmzalama/cihaz gerektirmez.
on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - "apps/apple/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/apple/**"

jobs:
  core-tests:
    name: Core birim testleri
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift sürümü
        run: swift --version
      - name: Core testleri
        working-directory: apps/apple/Packages/Core
        run: swift test --parallel
      - name: Design derleme
        working-directory: apps/apple/Packages/Design
        run: swift build
